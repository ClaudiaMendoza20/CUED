<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUED - Proyectos</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="ph">
    <div class="ph-left">
      <h1><i class="fa fa-folder-open" style="color:var(--gold);margin-right:9px"></i>Proyectos</h1>
      <p>Crea un proyecto, elige al cliente y los módulos de cálculo a utilizar.</p>
    </div>
    <div class="ph-right">
      <input id="srch" type="text" placeholder="Buscar proyecto..." style="width:220px" oninput="filtrar()">
      <button class="btn btn-p" onclick="abrirModal()"><i class="fa fa-plus"></i> Nuevo Proyecto</button>
    </div>
  </div>
  <div id="grid" class="pg"><div class="empty"><i class="fa fa-spinner fa-spin" style="font-size:22px;color:var(--gold)"></i><br>Cargando...</div></div>
</div>

<!-- MODAL -->
<div class="mbg" id="modal">
<div class="modal" style="width:min(600px,100%)">
  <h3 id="mT"><i class="fa fa-folder-plus" style="color:var(--gold)"></i> Nuevo Proyecto</h3>
  <div class="g2">
    <div><span class="flabel">Nombre del proyecto *</span><input id="mNom" placeholder="Ej: Torre Altum A"></div>
    <div><span class="flabel">Estado</span>
      <select id="mSt"><option value="activo">Activo</option><option value="pausado">Pausado</option><option value="terminado">Terminado</option></select>
    </div>
  </div>
  <span class="flabel">Cliente registrado</span>
  <select id="mCli"><option value="">— Sin cliente —</option></select>
  <div style="margin:5px 0 2px"><a href="admin.html" style="font-size:11px;color:var(--gold);text-decoration:none"><i class="fa fa-plus"></i> Registrar nuevo cliente</a></div>
  <span class="flabel">Descripción</span>
  <input id="mDes" placeholder="Edificio residencial 10 niveles...">
  <span class="flabel" style="margin-top:16px">Módulos de cálculo que se van a usar</span>
  <div class="mod-sel-g" id="modSel"></div>
  <div class="mf">
    <button class="btn btn-p" onclick="guardar()" id="btnG"><i class="fa fa-save"></i> Guardar</button>
    <button class="btn btn-s" onclick="cerrar()">Cancelar</button>
  </div>
</div>
</div>

<script src="config.js"></script>
<script src="sidebar.js"></script>
<script>
initSidebar('proyectos');

const MODS=[
  {key:'electrico', icon:'fa-bolt',              label:'Eléctrico'},
  {key:'caida',     icon:'fa-arrow-trend-down',  label:'Caída Tensión'},
  {key:'motores',   icon:'fa-gear',              label:'Motores'},
  {key:'cuadros',   icon:'fa-table',             label:'Cuadros Carga'},
  {key:'hidraulico',icon:'fa-droplet',           label:'Hidráulico'},
  {key:'cisterna',  icon:'fa-database',          label:'Cisterna'},
  {key:'sanitario', icon:'fa-toilet',            label:'Sanitario'},
  {key:'pluvial',   icon:'fa-cloud-rain',        label:'Pluvial'},
  {key:'gas',       icon:'fa-wind',              label:'Gas / Aire'},
  {key:'gas_lp',    icon:'fa-fire-flame-curved', label:'Gas LP'},
  {key:'hvac',      icon:'fa-fan',               label:'HVAC'},
  {key:'incendios', icon:'fa-fire',              label:'Incendios'},
];

let todos=[], editId=null, selMods=new Set();

function renderModSel(){
  document.getElementById('modSel').innerHTML=MODS.map(m=>`
    <div class="mod-opt${selMods.has(m.key)?' sel':''}" onclick="togMod('${m.key}')">
      <i class="fa ${m.icon} moi"></i>
      <span class="mos">${m.label}</span>
      <div class="chkb">${selMods.has(m.key)?'<i class="fa fa-check"></i>':''}</div>
    </div>`).join('');
}
function togMod(k){ selMods.has(k)?selMods.delete(k):selMods.add(k); renderModSel(); }

async function cargarClientes(){
  try{
    const cl=await sbFetch('clientes',{query:'?order=nombre.asc&select=id,nombre,empresa'});
    const s=document.getElementById('mCli');
    s.innerHTML='<option value="">— Sin cliente —</option>';
    cl.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.nombre+(c.empresa?' — '+c.empresa:'');s.appendChild(o);});
  }catch(e){}
}

async function cargar(){
  try{
    todos=await sbFetch('proyectos',{query:'?order=created_at.desc'});
    render(todos);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><i class="fa fa-circle-xmark" style="color:var(--red)"></i><br>Error al cargar. Verifica la conexión Supabase.</div>';
  }
}

function render(lista){
  const g=document.getElementById('grid');
  if(!lista.length){
    g.innerHTML=`<div class="empty" style="grid-column:1/-1">
      <i class="fa fa-folder-open" style="font-size:36px;color:rgba(255,255,255,.07);margin-bottom:12px"></i><br>
      No hay proyectos todavía.<br>
      <button class="btn btn-p" style="margin-top:14px" onclick="abrirModal()"><i class="fa fa-plus"></i> Crear primer proyecto</button>
    </div>`;return;
  }
  g.innerHTML=lista.map(p=>{
    const mods=JSON.parse(p.modulos||'[]');
    const tags=mods.map(k=>{const m=MODS.find(x=>x.key===k);return m?`<span class="mod-tag"><i class="fa ${m.icon}" style="margin-right:3px"></i>${m.label}</span>`:''}).join('');
    return`<div class="pc">
      <span class="badge ${p.status==='activo'?'b-ok':p.status==='pausado'?'b-w':'b-off'}">${p.status||'activo'}</span>
      <div class="pc-name">${p.nombre}</div>
      <div class="pc-cli"><i class="fa fa-user"></i>${p.cliente_nombre||'Sin cliente'}</div>
      ${p.descripcion?`<div style="font-size:11px;color:var(--dim);margin-bottom:6px">${p.descripcion}</div>`:''}
      <div class="pc-mods">${tags||'<span class="mod-tag" style="opacity:.35">Sin módulos asignados</span>'}</div>
      <div class="pc-foot">
        <button class="btn btn-p" style="flex:1;justify-content:center" onclick="abrirProy('${p.id}')">
          <i class="fa fa-arrow-right"></i> Abrir
        </button>
        <button class="btn btn-s" onclick="editar('${p.id}')" title="Editar proyecto"><i class="fa fa-pen"></i> Editar</button>
        <button class="bic del" onclick="eliminar('${p.id}','${p.nombre.replace(/'/g,'')}')"><i class="fa fa-trash"></i></button>
      </div>
    </div>`;
  }).join('');
}

function filtrar(){
  const q=document.getElementById('srch').value.toLowerCase();
  render(todos.filter(p=>(p.nombre||'').toLowerCase().includes(q)||(p.cliente_nombre||'').toLowerCase().includes(q)));
}

function abrirProy(id){
  const p=todos.find(x=>x.id===id);
  if(p){ setProyecto(p); window.location.href='proyecto_detalle.html'; }
}

function abrirModal(p=null){
  editId=p?.id||null;
  selMods=new Set(JSON.parse(p?.modulos||'[]'));
  document.getElementById('mT').innerHTML=`<i class="fa fa-${p?'pen':'folder-plus'}" style="color:var(--gold)"></i> ${p?'Editar Proyecto':'Nuevo Proyecto'}`;
  document.getElementById('mNom').value=p?.nombre||'';
  document.getElementById('mSt').value=p?.status||'activo';
  document.getElementById('mCli').value=p?.cliente_id||'';
  document.getElementById('mDes').value=p?.descripcion||'';
  renderModSel();
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('mNom').focus(),80);
}
function cerrar(){ document.getElementById('modal').classList.remove('open'); editId=null; }

async function guardar(){
  const nom=document.getElementById('mNom').value.trim();
  if(!nom){toast('El nombre es requerido','err');return;}
  const btn=document.getElementById('btnG');
  btn.disabled=true; btn.innerHTML='<i class="fa fa-spinner fa-spin"></i>';
  const cs=document.getElementById('mCli');
  const cId=cs.value||null;
  const cNom=cId?cs.options[cs.selectedIndex].text.split(' — ')[0]:null;
  const body={nombre:nom,status:document.getElementById('mSt').value,cliente_id:cId,cliente_nombre:cNom,descripcion:document.getElementById('mDes').value.trim(),modulos:JSON.stringify([...selMods])};
  try{
    if(editId){ await sbPatch('proyectos',`?id=eq.${editId}`,body); toast('Proyecto actualizado'); }
    else{ await sbFetch('proyectos',{method:'POST',body}); toast('Proyecto creado'); }
    cerrar(); cargar();
  }catch(e){ toast('Error al guardar','err'); console.error(e); }
  finally{ btn.disabled=false; btn.innerHTML='<i class="fa fa-save"></i> Guardar'; }
}

function editar(id){ const p=todos.find(x=>x.id===id); if(p) abrirModal(p); }

async function eliminar(id,nom){
  if(!confirmar(`¿Eliminar el proyecto "${nom}"?\nEsta acción no se puede deshacer.`))return;
  try{ await sbDel('proyectos',`?id=eq.${id}`); toast('Proyecto eliminado'); cargar(); }
  catch(e){ toast('Error al eliminar','err'); }
}

document.getElementById('modal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal')) cerrar(); });
cargar(); cargarClientes(); renderModSel();
</script>
</body>
</html>
