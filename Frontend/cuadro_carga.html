<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUED - Cuadros de Carga</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.ct{width:100%;border-collapse:collapse;}
.ct th{background:rgba(255,255,255,.03);padding:10px 14px;text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);}
.ct td{padding:7px 14px;border-bottom:1px solid var(--border);}
.ct input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:7px 10px;color:white;width:100%;font-size:13px;}
.ct input:focus{border-color:rgba(255,196,0,.35);outline:none;}
.ct select{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:7px 10px;color:white;width:100%;font-size:13px;}
.btn-add{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.12);border-radius:9px;padding:10px;width:100%;color:var(--dim);cursor:pointer;font-size:13px;transition:all .2s;margin-top:10px;}
.btn-add:hover{background:rgba(255,196,0,.05);border-color:rgba(255,196,0,.25);color:var(--gold);}
.sum-row{display:flex;gap:16px;margin-bottom:20px;}
.sc{flex:1;background:#0f1f38;border:1px solid var(--border);border-radius:11px;padding:18px;text-align:center;}
.sv{font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;}
.sl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:4px;}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="ph">
    <div class="ph-title">
      <h1><i class="fa fa-table" style="color:var(--gold);margin-right:9px"></i>Cuadros de Carga</h1>
      <p>Genera cuadros de carga dinámicos con factor de demanda.</p>
    </div>
    <div class="ph-actions">
      <button class="btn btn-d" onclick="limpiarTodo()"><i class="fa fa-eraser"></i> Limpiar</button>
      <button class="btn btn-s" onclick="agregarFila()"><i class="fa fa-plus"></i> Agregar fila</button>
      <button class="btn btn-p" onclick="guardarTodo()"><i class="fa fa-save"></i> Guardar Todo</button>
    </div>
  </div>

  <div class="sum-row">
    <div class="sc"><div class="sv" id="sumT" style="color:var(--gold)">0</div><div class="sl">Carga Total Instalada (kW)</div></div>
    <div class="sc"><div class="sv" id="sumD" style="color:#00d4ff">0</div><div class="sl">Demanda Total (kW)</div></div>
    <div class="sc"><div class="sv" id="sumC" style="color:#00e0a4">0</div><div class="sl">Circuitos</div></div>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <table class="ct">
      <thead><tr><th>#</th><th>Descripción del Elemento</th><th>Carga (kW)</th><th>Factor de Demanda</th><th>Carga Total</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div style="padding:10px 14px">
      <button class="btn-add" onclick="agregarFila()"><i class="fa fa-plus"></i> Agregar concepto</button>
    </div>
  </div>

  <div id="a-ok" class="a-ok" style="margin-top:12px"><i class="fa fa-circle-check"></i> Cuadro guardado en Supabase</div>
  <div id="a-err" class="a-err" style="margin-top:12px"><i class="fa fa-circle-xmark"></i> Error al guardar</div>
</div>

<script src="config.js"></script>
<script src="sidebar.js"></script>
<script>
initSidebar('cuadros');
let filas=[],nid=1;

function agregarFila(desc='',carga=0,factor=1.25){
  const id=nid++;
  filas.push({id,desc,carga,factor});
  render();
}

function eliminarFila(id){
  filas=filas.filter(f=>f.id!==id);
  render();
}

function render(){
  let ti=0,td=0;
  document.getElementById('tbody').innerHTML=filas.map((f,i)=>{
    const sub=(parseFloat(f.carga)||0)*(parseFloat(f.factor)||1.25);
    ti+=parseFloat(f.carga)||0;td+=sub;
    return`<tr>
      <td style="color:var(--dim);width:36px">${i+1}</td>
      <td><input value="${f.desc}" placeholder="Descripción..." onchange="filas[${i}].desc=this.value"></td>
      <td style="width:130px"><input type="number" value="${f.carga}" step="0.1" oninput="filas[${i}].carga=this.value;render()"></td>
      <td style="width:140px">
        <select onchange="filas[${i}].factor=this.value;render()">
          <option value="1.0" ${f.factor==1.0?'selected':''}>1.00</option>
          <option value="1.25" ${f.factor==1.25?'selected':''}>1.25</option>
          <option value="1.5" ${f.factor==1.5?'selected':''}>1.50</option>
          <option value="0.8" ${f.factor==0.8?'selected':''}>0.80</option>
        </select>
      </td>
      <td style="width:120px;color:var(--gold);font-weight:600">${sub.toFixed(2)} kW</td>
      <td style="width:46px">
        <button class="btn-ic d" onclick="eliminarFila(${f.id})" title="Eliminar fila"><i class="fa fa-trash"></i></button>
      </td>
    </tr>`;
  }).join('')||`<tr><td colspan="6" class="empty">Sin elementos — presiona "Agregar fila"</td></tr>`;
  document.getElementById('sumT').textContent=ti.toFixed(2);
  document.getElementById('sumD').textContent=td.toFixed(2);
  document.getElementById('sumC').textContent=filas.length;
}

function limpiarTodo(){
  if(filas.length&&!confirmar('¿Limpiar todo el cuadro de carga?'))return;
  filas=[];nid=1;render();toast('Cuadro limpiado');
}

async function guardarTodo(){
  if(!filas.length){toast('Agrega al menos un elemento','err');return;}
  try{
    for(const f of filas){
      await sbFetch('cuadros_carga',{method:'POST',body:{descripcion:f.desc||'Sin descripción',carga_kw:parseFloat(f.carga)||0,factor_demanda:parseFloat(f.factor)||1.25}});
    }
    toast('Cuadro guardado');
    document.getElementById('a-ok').style.display='block';
    setTimeout(()=>document.getElementById('a-ok').style.display='none',3000);
  }catch(e){
    toast('Error al guardar','err');
    document.getElementById('a-err').style.display='block';
    setTimeout(()=>document.getElementById('a-err').style.display='none',3000);
  }
}

async function cargarGuardados(){
  try{
    const d=await sbFetch('cuadros_carga',{query:'?order=created_at.desc&limit=20'});
    if(d.length)d.forEach(r=>agregarFila(r.descripcion,r.carga_kw,r.factor_demanda));
    else{agregarFila('Tablero Principal TP-01',120,1.25);agregarFila('Subtablero ST-01',60,1.25);}
  }catch(e){agregarFila('Tablero Principal TP-01',120,1.25);}
}
cargarGuardados();
</script>
</body>
</html>
